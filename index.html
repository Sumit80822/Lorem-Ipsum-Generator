<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Compare two blocks of text and highlight the differences. An online tool to easily find what has changed between two text versions.">
    <meta name="keywords" content="text compare, diff tool, compare text, text difference, online diff, text comparison tool">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="YOUR_WEBSITE_URL_HERE"> <!-- Replace with actual URL when deployed -->
    <meta property="og:title" content="Text Compare Tool - Highlight Differences Easily">
    <meta property="og:description" content="Quickly compare two pieces of text and see the highlighted differences. Ideal for checking revisions or finding changes.">
    <meta property="og:image" content="YOUR_IMAGE_URL_HERE"> <!-- Replace with an image URL for social sharing -->

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="YOUR_WEBSITE_URL_HERE"> <!-- Replace with actual URL when deployed -->
    <meta property="twitter:title" content="Text Compare Tool - Highlight Differences Easily">
    <meta property="twitter:description" content="Compare two text blocks and instantly see what's new, changed, or removed.">
    <meta property="twitter:image" content="YOUR_IMAGE_URL_HERE"> <!-- Replace with an image URL for social sharing -->

    <title>Text Compare Tool - Highlight Differences</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Text Comparison Tool</h1>
    </header>
    <main>
        <div class="container">
            <div class="text-input-area">
                <h2>Original Text</h2>
                <textarea id="text1" placeholder="Paste your first block of text here..."></textarea>
            </div>
            <div class="text-input-area">
                <h2>Changed Text</h2>
                <textarea id="text2" placeholder="Paste your second block of text here..."></textarea>
            </div>
        </div>
        <div class="controls">
            <button id="compareBtn">Compare Texts</button>
        </div>
        <div id="resultsContainer">
            <h2>Differences</h2>
            <div id="diffOutput">
                <!-- Differences will be shown here -->
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2023 Your Tool Name - <a href="#">Privacy Policy</a></p> <!-- Replace Your Tool Name -->
    </footer>
    <script src="lib/diff_match_patch.js"></script>
    <script src="script.js"></script>
</body>
</html>
